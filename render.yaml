# Two services: a static frontend and one authoritative game server.
# ALLOWED_ORIGINS is entered in Render to avoid a circular service dependency.
services:
  - type: web
    name: pokesoccer-server
    repo: https://github.com/SebastianBerrios/pokesoccer
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci --omit=dev --ignore-scripts
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production
      - key: MAX_ROOMS
        value: "2"
      - key: HOST
        value: 0.0.0.0
      - key: ALLOWED_ORIGINS
        sync: false

  - type: web
    name: pokesoccer-web
    repo: https://github.com/SebastianBerrios/pokesoccer
    runtime: static
    buildCommand: npm ci --include=dev --ignore-scripts && npm run build
    staticPublishPath: apps/client/dist
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: VITE_SERVER_URL
        fromService:
          type: web
          name: pokesoccer-server
          envVarKey: RENDER_EXTERNAL_URL
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
